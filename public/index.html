<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Recognition Service</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .upload-section {
            border: 3px dashed #ddd;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .upload-section:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .upload-section.dragover {
            border-color: #667eea;
            background: #f0f4ff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 3em;
            color: #ddd;
            margin-bottom: 20px;
        }

        .upload-section h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .upload-section p {
            color: #666;
            margin-bottom: 20px;
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .preview-section {
            margin: 30px 0;
            text-align: center;
        }

        .preview-image {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .results-section {
            margin-top: 30px;
        }

        .results-header {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .results-header h3 {
            color: #333;
            margin-bottom: 5px;
        }

        .results-count {
            color: #667eea;
            font-weight: 600;
            font-size: 1.1em;
        }

        .detection-item {
            background: white;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .detection-item:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .detection-info {
            display: flex;
            flex-direction: column;
        }

        .detection-class {
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
            text-transform: capitalize;
        }

        .detection-details {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        .confidence-bar {
            width: 100px;
            height: 8px;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s ease;
        }

        .confidence-text {
            margin-left: 10px;
            font-weight: 600;
            color: #667eea;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .error {
            background: #ffe6e6;
            border: 1px solid #ffcccc;
            color: #cc0000;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .success {
            background: #e6ffe6;
            border: 1px solid #ccffcc;
            color: #006600;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }

        @media (max-width: 600px) {
            .container {
                margin: 10px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 2em;
            }

            .content {
                padding: 20px;
            }

            .detection-item {
                flex-direction: column;
                align-items: stretch;
            }

            .confidence-container {
                margin-top: 10px;
                display: flex;
                align-items: center;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Object Recognition</h1>
            <p>Upload an image to detect and identify objects using AI</p>
        </div>

        <div class="content">
            <div class="upload-section" id="uploadSection">
                <div class="upload-icon">📸</div>
                <h3>Choose an image or drag & drop</h3>
                <p>Supported formats: JPG, PNG, GIF, WebP (max 10MB)</p>
                <button class="btn" onclick="document.getElementById('imageInput').click()">
                    Select Image
                </button>
                <input type="file" id="imageInput" accept="image/*">
            </div>

            <div class="preview-section" id="previewSection" style="display: none;">
                <img id="previewImage" class="preview-image" alt="Preview">
                <br><br>
                <button class="btn" id="analyzeBtn" onclick="analyzeImage()">
                    🔍 Analyze Image
                </button>
                <button class="btn" id="detectPosesBtn" onclick="analyzePoses()" style="margin-left: 10px; background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);">
                    🏃 Detect Poses
                </button>
                <button class="btn" id="downloadBase64Btn" onclick="downloadFromBase64()" style="display: none; margin-left: 10px; background: #28a745;">
                    💾 Save as Base64
                </button>
            </div>

            <div id="resultsSection" style="display: none;">
                <div class="results-section">
                    <div class="results-header">
                        <h3>Detection Results</h3>
                        <div class="results-count" id="resultsCount"></div>
                    </div>
                    <div id="detectionsList"></div>
                </div>
            </div>

            <div id="messageArea"></div>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const uploadSection = document.getElementById('uploadSection');
        const previewSection = document.getElementById('previewSection');
        const previewImage = document.getElementById('previewImage');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const resultsSection = document.getElementById('resultsSection');
        const resultsCount = document.getElementById('resultsCount');
        const detectionsList = document.getElementById('detectionsList');
        const messageArea = document.getElementById('messageArea');
        const downloadBase64Btn = document.getElementById('downloadBase64Btn');

        let selectedFile = null;
        let lastAnalysisResult = null;

        // File input change handler
        imageInput.addEventListener('change', handleFileSelect);

        // Drag and drop handlers
        uploadSection.addEventListener('dragover', e => {
            e.preventDefault();
            uploadSection.classList.add('dragover');
        });

        uploadSection.addEventListener('dragleave', () => {
            uploadSection.classList.remove('dragover');
        });

        uploadSection.addEventListener('drop', e => {
            e.preventDefault();
            uploadSection.classList.remove('dragover');

            const files = e.dataTransfer.files;
            if (files.length > 0) {
                const file = files[0];
                if (file.type.startsWith('image/')) {
                    selectedFile = file;
                    showPreview(file);
                } else {
                    showMessage('Please select a valid image file.', 'error');
                }
            }
        });

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                showPreview(file);
            }
        }

        function showPreview(file) {
            const reader = new FileReader();
            reader.onload = e => {
                previewImage.src = e.target.result;
                previewSection.style.display = 'block';
                resultsSection.style.display = 'none';
                downloadBase64Btn.style.display = 'none';
                clearMessages();
            };
            reader.readAsDataURL(file);
        }

        async function analyzeImage() {
            if (!selectedFile) {
                showMessage('Please select an image first.', 'error');
                return;
            }

            analyzeBtn.disabled = true;
            analyzeBtn.innerHTML = '<div class="loading"></div>Analyzing...';
            clearMessages();

            try {
                const formData = new FormData();
                formData.append('image', selectedFile);
                formData.append('generateImage', true);

                const response = await fetch('/api/detect', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Analysis failed');
                }

                displayResults(result, 'detections');
                showMessage(`Analysis complete! Found ${result.detections.length} objects.`, 'success');
                lastAnalysisResult = result;
                downloadBase64Btn.style.display = 'inline-block';

            } catch (error) {
                console.error('Analysis error:', error);
                showMessage(`Error: ${error.message}`, 'error');
            } finally {
                analyzeBtn.disabled = false;
                analyzeBtn.innerHTML = '🔍 Analyze Image';
            }
        }

        async function analyzePoses() {
            if (!selectedFile) {
                showMessage('Please select an image first.', 'error');
                return;
            }

            const detectPosesBtn = document.getElementById('detectPosesBtn');
            detectPosesBtn.disabled = true;
            detectPosesBtn.innerHTML = '<div class="loading"></div>Detecting Poses...';
            clearMessages();

            try {
                const formData = new FormData();
                formData.append('image', selectedFile);
                formData.append('generateImage', true);

                const response = await fetch('/api/detect-poses', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Pose detection failed');
                }

                displayResults(result, 'poses');
                showMessage(`Pose detection complete! Found ${result.poses.length} poses.`, 'success');
                lastAnalysisResult = result;
                downloadBase64Btn.style.display = 'inline-block';

            } catch (error) {
                console.error('Pose detection error:', error);
                showMessage(`Error: ${error.message}`, 'error');
            } finally {
                detectPosesBtn.disabled = false;
                detectPosesBtn.innerHTML = '🏃 Detect Poses';
            }
        }

        function displayResults(result, type) {
            document.querySelector('.results-header h3').textContent = type === 'detections' ? 'Detection Results' : 'Pose Detection Results';

            if (type === 'detections') {
                resultsCount.textContent = `Found ${result.detections.length} objects`;

                detectionsList.innerHTML = '';

                // Display the annotated image if available
                if (result.annotatedImage) {
                    previewImage.src = result.annotatedImage;
                }

                result.detections.forEach((detection, index) => {
                    const item = document.createElement('div');
                    item.className = 'detection-item';

                    const confidence = Math.round(detection.score * 100);

                    item.innerHTML = `
                        <div class="detection-info">
                            <div class="detection-class">${detection.class}</div>
                            <div class="detection-details">
                                Position: (${detection.bbox.x}, ${detection.bbox.y}) • 
                                Size: ${detection.bbox.width}×${detection.bbox.height}
                            </div>
                        </div>
                        <div class="confidence-container" style="display: flex; align-items: center;">
                            <div class="confidence-bar">
                                <div class="confidence-fill" style="width: ${confidence}%"></div>
                            </div>
                            <div class="confidence-text">${confidence}%</div>
                        </div>
                    `;

                    detectionsList.appendChild(item);
                });
            } else if (type === 'poses') {
                resultsCount.textContent = `Found ${result.poses.length} poses`;

                detectionsList.innerHTML = '';

                // Display the annotated image if available
                if (result.annotatedImage) {
                    previewImage.src = result.annotatedImage;
                }

                result.poses.forEach((pose, index) => {
                    const item = document.createElement('div');
                    item.className = 'detection-item';

                    const confidence = Math.round(pose.score * 100);

                    const keypointsList = pose.keypoints.map(kp => `${kp.name}: (${kp.x}, ${kp.y}) ${Math.round(kp.score * 100)}%`).join('<br>');

                    item.innerHTML = `
                        <div class="detection-info">
                            <div class="detection-class">Pose ${index + 1}</div>
                            <div class="detection-details">
                                ${keypointsList}
                            </div>
                        </div>
                        <div class="confidence-container" style="display: flex; align-items: center;">
                            <div class="confidence-bar">
                                <div class="confidence-fill" style="width: ${confidence}%"></div>
                            </div>
                            <div class="confidence-text">${confidence}%</div>
                        </div>
                    `;

                    detectionsList.appendChild(item);
                });
            }

            resultsSection.style.display = 'block';
        }

        function showMessage(message, type) {
            messageArea.innerHTML = `<div class="${type}">${message}</div>`;
            setTimeout(() => {
                messageArea.innerHTML = '';
            }, 5000);
        }

        function clearMessages() {
            messageArea.innerHTML = '';
        }

        function downloadFromBase64() {
            if (!lastAnalysisResult || !lastAnalysisResult.annotatedImage) {
                showMessage('No annotated image available to download.', 'error');
                return;
            }

            try {
                // Convert base64 to blob for better browser compatibility
                const base64Data = lastAnalysisResult.annotatedImage.split(',')[1];
                const byteCharacters = atob(base64Data);
                const byteNumbers = new Array(byteCharacters.length);

                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }

                const byteArray = new Uint8Array(byteNumbers);
                const blob = new Blob([byteArray], { type: 'image/jpeg' });

                // Create download link with blob
                const url = window.URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `detected_base64_${selectedFile.name || 'image.jpg'}`;

                // Trigger download
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                // Clean up the blob URL
                window.URL.revokeObjectURL(url);

                showMessage('Image downloaded successfully from base64!', 'success');
            } catch (error) {
                console.error('Base64 download error:', error);
                showMessage('Failed to download image from base64.', 'error');
            }
        }
    </script>
</body>

</html>
