<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Security Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .image-item {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .image-item:hover {
            transform: translateY(-5px);
        }

        .image-item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
        }

        .image-info {
            padding: 10px;
            font-size: 12px;
            color: #666;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 18px;
            color: #666;
        }

        .error {
            text-align: center;
            padding: 50px;
            font-size: 18px;
            color: #ff6b6b;
        }
    </style>
</head>

<body>
    <h1>Home Security Gallery</h1>
    <div id="gallery" class="gallery"></div>

    <script>
        async function loadImages() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '<div class="loading">Loading images...</div>';

            try {
                const response = await fetch('/api/images');
                const data = await response.json();

                if (data.images && data.images.length > 0) {
                    gallery.innerHTML = '';
                    data.images.forEach(imageData => {
                        const item = document.createElement('div');
                        item.className = 'image-item';

                        // Use the timestamp from the API response
                        const date = new Date(imageData.timestamp);
                        const dateStr = date.toLocaleString();

                        item.innerHTML = `
                            <img src="/images/${imageData.filename}" alt="${imageData.filename}" loading="lazy">
                            <div class="image-info">${dateStr}</div>
                        `;

                        gallery.appendChild(item);
                    });
                } else {
                    gallery.innerHTML = '<div class="error">No images found</div>';
                }
            } catch (error) {
                console.error('Error loading images:', error);
                gallery.innerHTML = '<div class="error">Failed to load images</div>';
            }
        }

        // Load images when page loads
        loadImages();

        // Refresh every 30 seconds
        setInterval(loadImages, 30000);
    </script>
</body>

</html>
