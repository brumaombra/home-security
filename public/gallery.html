<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Security Gallery</title>
    <link rel="stylesheet" href="style/style.css">
    <style>
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .image-item {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
            cursor: pointer;
        }

        .image-item:hover {
            transform: translateY(-5px);
        }

        .image-item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
        }

        .image-info {
            padding: 10px;
            font-size: 12px;
            color: #666;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 18px;
            color: #666;
        }

        .error {
            text-align: center;
            padding: 50px;
            font-size: 18px;
            color: #ff6b6b;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }

        .modal img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        .modal.show {
            display: flex;
        }
    </style>
</head>

<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
    </nav>
    <div class="container">
        <div class="header">
            <h1>🏠 Home Security Gallery</h1>
            <p>View all detected images from your home security system</p>
        </div>
        <div class="content">
            <div id="gallery" class="gallery"></div>
        </div>
    </div>

    <div id="modal" class="modal">
        <img id="modalImage" src="" alt="">
    </div>

    <script>
        const gallery = document.getElementById('gallery');
        const modal = document.getElementById('modal');
        const modalImage = document.getElementById('modalImage');

        async function loadImages() {
            gallery.innerHTML = '<div class="loading">Loading images...</div>';

            try {
                const response = await fetch('/api/images');
                const data = await response.json();

                if (data.images && data.images.length > 0) {
                    gallery.innerHTML = '';
                    data.images.forEach(imageData => {
                        const item = document.createElement('div');
                        item.className = 'image-item';

                        // Use the timestamp from the API response
                        const date = new Date(imageData.timestamp);
                        const dateStr = date.toLocaleString();

                        item.innerHTML = `
                            <img src="/images/${imageData.filename}" alt="${imageData.filename}" loading="lazy">
                            <div class="image-info">${dateStr}</div>
                        `;

                        gallery.appendChild(item);
                    });
                } else {
                    gallery.innerHTML = '<div class="error">No images found</div>';
                }
            } catch (error) {
                console.error('Error loading images:', error);
                gallery.innerHTML = '<div class="error">Failed to load images</div>';
            }
        }

        // Event listener for opening images in modal
        gallery.addEventListener('click', (e) => {
            if (e.target.tagName === 'IMG') {
                modalImage.src = e.target.src;
                modal.classList.add('show');
            }
        });

        // Event listener for closing modal
        modal.addEventListener('click', () => {
            modal.classList.remove('show');
        });

        // Load images when page loads
        loadImages();

        // Refresh every 30 seconds
        setInterval(loadImages, 30000);
    </script>
</body>

</html>
